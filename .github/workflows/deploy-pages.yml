name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一時間只保留一次部署，排隊中的 newer run 會取消舊的
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 裁剪「连续文本当量」功能（仅部署产物，不改仓库源码）
        shell: bash
        run: python3 scripts/strip-continuous.py

      - name: 裁剪「候选个数」功能（仅部署产物，不改仓库源码）
        shell: bash
        run: python3 scripts/strip-candidates.py

      - name: 裁剪「方案对比页说明」区块（仅部署产物，不改仓库源码）
        shell: bash
        run: python3 scripts/strip-comparison-note.py

      - name: 裁剪「其他页面说明」内容（仅部署产物，不改仓库源码）
        shell: bash
        run: python3 scripts/strip-other-notes.py

      - uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
        with:
          version: 12.23.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 安裝依賴
        run: pnpm install --frozen-lockfile

      - name: 下載數據與方案文件
        # public/data、public/schemes、public/texts 被 .gitignore 排除，CI 需重新抓取
        run: pnpm run fetch

      - name: 建置（ Pages 子路徑 ）
        env:
          VITE_BASE: /yuhao-assess/
        run: pnpm exec vite build

      - name: SPA 路由回退
        # GitHub Pages 對未知路徑返回 404.html；內容用 index.html 讓 React Router 接管
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
